<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth Information Jukebox</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="earth-interface">

    <!-- Moving Earth scene -->
    <div class="earth-scene" aria-hidden="true"></div>
    <div class="scene-darkening" aria-hidden="true"></div>

    <!-- Floating interface -->
    <section class="interface-content">

      <p class="brand">EARTH INFORMATION JUKEBOX</p>

      <div class="welcome-area">
        <h1>Listen to Earth.</h1>

        <p id="paMessage">
          Good morning, and welcome to Earth Information Jukebox.
          I'm so glad you're here.
          Please click “Talk with me” to begin our conversation.
        </p>

        <button id="talkButton" type="button">
          🎙 Talk with me
        </button>

        <p id="statusMessage" class="status" aria-live="polite"></p>
      </div>

      <!-- Small floating controls -->
      <div class="floating-controls">
        <button id="languageButton" type="button">🌐 Language</button>
        <button id="locationButton" type="button">📍 Location</button>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
